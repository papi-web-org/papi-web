[build-system]
requires = ["setuptools >= 83.0.0", "wheel >= 0.47.0", "requests ~= 2.34.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sharly-chess"
description = "An application to help chess arbiters and organizers manage their tournaments"
requires-python = ">=3.13.0"
version = "5.0.3"

authors = [
  { name = "Pascal Aubry", email = "support@sharly-chess.com" },
  { name = "Sammy Plat", email = "support@sharly-chess.com" },
  { name = "Timothy Armes", email = "support@sharly-chess.com" },
  { name = "Youri Aubry", email = "support@sharly-chess.com" },
]
license = { text = "AGPL v3.0" }
readme = "README.md"
dependencies = [
  "advancedhtmlparser ~= 9.0.2",
  "aiosqlite ~= 0.22.1",
  "aiosqlitepool ~= 1.0.0",
  "apluggy ~= 1.1.2",
  # Latest compatible version should always be preferred due to security reasons
  # This can be pinned later due to security concerns
  "argon2-cffi",
  "babel ~= 2.18.0",
  "chardet ~= 7.4.3",
  "chess ~= 1.11.2",
  "colorama ~= 0.4.6",
  "colorlog ~= 6.10.1",
  "cryptography ~= 49.0.0",
  "fonttools ~= 4.63.0",
  "httpdate ~= 1.2.0",
  "iso4217parse ~= 0.6.2",
  "jinja2 ~= 3.1.6",
  "litestar ~= 2.24.0",
  "markdown-it-py ~= 4.2.0",
  "packaging ~= 26.2",
  "paramiko >= 5.0.0",
  "pathvalidate ~= 3.3.1",
  "pefile == 2024.8.26",
  "pluggy ~= 1.6.0",
  "psutil ~= 7.2.2",
  "pycountry ~= 26.2.16",
  "pyexcel-ods3 ~= 0.6.1",
  "python-dotenv ~= 1.2.2",
  "python-tds ~= 1.17.1",
  "qrcode[pil] ~= 8.2",
  "requests ~= 2.34.2",
  "rubicon-objc ~= 0.5.6",
  "sniffio ~= 1.3.1",
  "text_unidecode ~= 1.3",
  "toga == 0.5.2",
  "toml ~= 0.10.2",
  "uvicorn ~= 0.51.0",
  "validators ~= 0.35.0",
  "wsproto ~= 1.3.2",
  "xlsxwriter ~= 3.2.9",
]

[project.optional-dependencies]
lint = [
  "mypy >= 2.3.0",
  "pipdeptree",
  "pre-commit",
  "ruff ~= 0.15.21",
  "validate-pyproject",
]

translate = [
  "transformers",
  "torch",
  "sentencepiece",
  "sacremoses",
]

export = [
  "pyinstaller-versionfile ~= 3.1.0",
  "pyinstaller ~= 6.21.0",
  "pip-licenses ~= 5.5.5",
  "dmgbuild ~= 1.6",
]

tests = [
  "pytest",
  "pytest-playwright",
  "pytest-asyncio",
  "pytest-base-url",
  "pytest-xdist",
]

scripts = [
  "scour ~= 0.38.2",
]

[tool.setuptools.package-data]
"data.pairings" = [
  "resources/*.mrec",
]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
mypy_path = "src:."
explicit_package_bases = true
namespace_packages = true
check_untyped_defs = true
disable_error_code = [
  "import-untyped",
  "no-redef",
]
