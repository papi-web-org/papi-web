<div class="mb-3">
    <span class="badge text-bg-secondary">{{ type_name }}</span>
</div>

<form id="pc-card-form" onsubmit="return false">
    <div class="mb-2">
        <label class="form-label small mb-1" for="pc-card-name">{{ _('Name') }}</label>
        <input type="text" class="form-control form-control-sm" id="pc-card-name" name="name" value="{{ data.name }}">
    </div>

    <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" role="switch" name="two_sided" id="pc-card-two-sided" {% if data.two_sided == 'on' %}checked{% endif %}>
        <label class="form-check-label small" for="pc-card-two-sided">{{ _('Two-sided (foldable)') }}</label>
    </div>

    <label class="form-label small mb-1">{{ _('Unit') }}</label>
    <div class="btn-group btn-group-sm w-100 mb-2" role="group">
        <input type="radio" class="btn-check" name="unit" id="pc-unit-mm" value="mm" {% if data.unit != 'in' %}checked{% endif %}>
        <label class="btn btn-outline-secondary" for="pc-unit-mm">{{ _('mm') }}</label>
        <input type="radio" class="btn-check" name="unit" id="pc-unit-in" value="in" {% if data.unit == 'in' %}checked{% endif %}>
        <label class="btn btn-outline-secondary" for="pc-unit-in">{{ _('in') }}</label>
    </div>

    <div class="row g-2 mb-2">
        <div class="col-4">
            <label class="form-label small mb-1" for="pc-card-width">{{ _('Width') }}</label>
            <input type="number" step="{{ '0.001' if data.unit == 'in' else '0.1' }}" class="form-control form-control-sm" id="pc-card-width" name="width" value="{{ data.width }}">
        </div>
        <div class="col-4">
            <label class="form-label small mb-1" for="pc-card-height">{{ _('Height') }}</label>
            <input type="number" step="{{ '0.001' if data.unit == 'in' else '0.1' }}" class="form-control form-control-sm" id="pc-card-height" name="height" value="{{ data.height }}">
        </div>
        <div class="col-4">
            <label class="form-label small mb-1" for="pc-card-padding">{{ _('Padding') }}</label>
            <input type="number" step="{{ '0.001' if data.unit == 'in' else '0.1' }}" class="form-control form-control-sm" id="pc-card-padding" name="padding" value="{{ data.padding }}">
        </div>
    </div>
</form>
